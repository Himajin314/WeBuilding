<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
  <title>お問い合わせ</title>
</head>

<body>
  <nav class="menubar"></nav>

  <header class="page-header">
    <h1 class="page-title">Contact Us</h1>
    <p class="page-description">ご質問、お見積もりのご依頼など、お気軽にお問い合わせください。</p>
  </header>

  <main class="contact-container">
    <form action="#" method="POST">
      <div class="form-group">
        <label for="name" class="form-label">お名前 <span style="color:red">*</span></label>
        <input type="text" id="name" name="name" class="form-input" placeholder="例: 山田 太郎" required>
      </div>

      <div class="form-group">
        <label for="email" class="form-label">メールアドレス <span style="color:red">*</span></label>
        <input type="email" id="email" name="email" class="form-input" placeholder="example@webuilding.jp" required>
      </div>

      <div class="form-group">
        <label for="subject" class="form-label">お問い合わせ種別</label>
        <select id="subject" name="subject" class="form-select">
          <option value="general">一般的なお問い合わせ</option>
          <option value="service">サービスについて</option>
          <option value="quote">お見積もり依頼</option>
          <option value="recruit">採用について</option>
          <option value="other">その他</option>
        </select>
      </div>

      <div class="form-group">
        <label for="message" class="form-label">お問い合わせ内容 <span style="color:red">*</span></label>
        <textarea id="message" name="message" class="form-textarea" placeholder="詳細をご記入ください" required></textarea>
      </div>

      <button type="submit" class="submit-btn">送信する</button>
    </form>
  </main>

  <footer></footer>
</body>

</html>

<script src="../global/components/menubar/menubar.js"></script>
<script src="../global/components/footer/footer.js"></script>
